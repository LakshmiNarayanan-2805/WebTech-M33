<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        font-family: Arial, Helvetica, sans-serif;
        box-sizing: border-box;
      }
      .box {
        width: 500px;
        height: 350px;
        border: 1px solid;
        background-image: url(https://wp.clutchpoints.com/wp-content/uploads/2025/03/WWE-news-Roman-Reigns-sends-strong-message-after-return.jpg?w=1200);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        box-shadow:
          rgba(0, 0, 0, 0.3) 0px 19px 38px,
          rgba(0, 0, 0, 0.22) 0px 15px 12px;
      }
      .label {
        background-color: orange;
        color: white;
        width: max-content;
        padding: 10px;
        margin: 10px;
        border-radius: 10px;
      }
      .inner-box {
        width: 80%;
        height: 200px;
        background-color: rgba(0, 0, 0, 0.5);
        margin: auto;
        border-radius: 3px;
        color: white;
        text-align: center;
        padding: 20px;
        line-height: 2px;
      }
      h2 {
        font-size: 35px;
      }
      h3 {
        font-weight: 200;
      }
      button {
        border: 0;
        background-color: green;
        color: white;
        padding: 12px 30px;
        font-size: 18px;
        margin-top: 20px;
        border-radius: 8px;
      }
      .box:hover {
        /* box-shadow: x-axis y-axis blur spread color; */
        /* box-shadow:
          rgba(0, 0, 0, 0.25) 0px 14px 28px,
          rgba(0, 0, 0, 0.22) 0px 10px 10px; */
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="label">WWE Superstar</div>
      <div class="inner-box">
        <h2>Roman Regins</h2>
        <h3>Aka Joe Anoai</h3>
        <button>Tribal Chief</button>
      </div>
    </div>
  </body>
</html>
