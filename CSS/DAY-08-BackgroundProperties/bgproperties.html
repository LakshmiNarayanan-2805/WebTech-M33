<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>

        background-position: center;
        background-size: cover;
      }

  <body>
    <h1>background-image: url("path") Demo</h1>
    <div class="box" id="box1"></div>
